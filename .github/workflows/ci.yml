name: CI

on:
  workflow_dispatch:
    inputs:
      full_validation:
        description: Run all release additions after required PR gates
        type: boolean
        default: false
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and i18n
    runs-on: ubuntu-latest
    outputs:
      functions_tests: ${{ steps.scope.outputs.functions_tests }}
      functions_emulator: ${{ steps.scope.outputs.functions_emulator }}
      emulator_integration: ${{ steps.scope.outputs.emulator_integration }}
      firestore: ${{ steps.scope.outputs.firestore }}
      e2e: ${{ steps.scope.outputs.e2e }}
    env:
      VITE_FIREBASE_API_KEY: ci-placeholder-api-key
      VITE_FIREBASE_APP_ID: ci-placeholder-app-id
      VITE_FIREBASE_AUTH_DOMAIN: ci-placeholder.firebaseapp.com
      VITE_FIREBASE_MESSAGING_SENDER_ID: '000000000000'
      VITE_FIREBASE_PROJECT_ID: ci-placeholder-project
      VITE_FIREBASE_STORAGE_BUCKET: ci-placeholder-project.appspot.com
      VITE_FIREBASE_MEASUREMENT_ID: G-PLACEHOLDER
      VITE_FIREBASE_DATABASE_ID: '(default)'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Plan affected CI gates
        id: scope
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CI_FORCE_FULL: ${{ github.event_name == 'workflow_dispatch' && inputs.full_validation && 'true' || 'false' }}
        run: node scripts/ciChangePlan.mjs

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint and i18n from canonical manifest
        run: node scripts/runManifestTests.mjs --group lint

      - name: Preserve translation parity reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: translation-parity-results
          include-hidden-files: true
          path: |
            .scratch/test-manifest/**
            .scratch/test-egress/*.log
          if-no-files-found: error
          retention-days: 7

  app-tests:
    name: App unit coverage
    needs: lint
    runs-on: ubuntu-latest
    env:
      VITE_FIREBASE_API_KEY: ci-placeholder-api-key
      VITE_FIREBASE_APP_ID: ci-placeholder-app-id
      VITE_FIREBASE_AUTH_DOMAIN: ci-placeholder.firebaseapp.com
      VITE_FIREBASE_MESSAGING_SENDER_ID: '000000000000'
      VITE_FIREBASE_PROJECT_ID: ci-placeholder-project
      VITE_FIREBASE_STORAGE_BUCKET: ci-placeholder-project.appspot.com
      VITE_FIREBASE_MEASUREMENT_ID: G-PLACEHOLDER
      VITE_FIREBASE_DATABASE_ID: '(default)'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install root dependencies
        run: npm ci --ignore-scripts

      - name: Install Functions dependencies
        run: npm ci --prefix functions --ignore-scripts

      - name: App and shared domain from canonical manifest
        run: node scripts/runManifestTests.mjs --group app

      - name: Preserve manifest reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-test-results
          include-hidden-files: true
          path: |
            .scratch/test-manifest/**
            .scratch/test-egress/*.log
          if-no-files-found: error
          retention-days: 7

  functions-tests:
    name: Functions unit tests
    needs: lint
    if: needs.lint.outputs.functions_tests == 'true'
    runs-on: ubuntu-latest
    env:
      VITE_FIREBASE_API_KEY: ci-placeholder-api-key
      VITE_FIREBASE_APP_ID: ci-placeholder-app-id
      VITE_FIREBASE_AUTH_DOMAIN: ci-placeholder.firebaseapp.com
      VITE_FIREBASE_MESSAGING_SENDER_ID: '000000000000'
      VITE_FIREBASE_PROJECT_ID: ci-placeholder-project
      VITE_FIREBASE_STORAGE_BUCKET: ci-placeholder-project.appspot.com
      VITE_FIREBASE_MEASUREMENT_ID: G-PLACEHOLDER
      VITE_FIREBASE_DATABASE_ID: '(default)'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install root dependencies
        run: npm ci --ignore-scripts

      - name: Install Functions dependencies
        run: npm ci --prefix functions --ignore-scripts

      - name: Functions build, units and infrastructure guards from manifest
        run: node scripts/runManifestTests.mjs --group functions-unit

      - name: Preserve manifest reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: functions-unit-results
          include-hidden-files: true
          path: |
            .scratch/test-manifest/**
            .scratch/test-egress/*.log
          if-no-files-found: error
          retention-days: 7

  functions-emulator:
    name: Functions emulator suite
    needs: lint
    if: needs.lint.outputs.functions_emulator == 'true'
    runs-on: ubuntu-latest
    # Measured suites total ~48 minutes locally; also allow dependency setup/build.
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      GCLOUD_PROJECT: demo-ski-school-e2e
      GOOGLE_CLOUD_PROJECT: demo-ski-school-e2e
      JAVA_TOOL_OPTIONS: -Xms512m -Xmx2g -XX:ActiveProcessorCount=2
      NODE_OPTIONS: --max-old-space-size=3072
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --ignore-scripts
      - run: npm ci --prefix functions --ignore-scripts
      - run: npm run build:functions
      - name: Canonical backend without reset duplicates or Functions triggers
        run: node scripts/runManifestTests.mjs --group backend
      - name: Isolated reset authorization and restoration rehearsal
        run: node scripts/runManifestTests.mjs --group reset
      - name: Verify zero Firestore egress attempts
        if: always()
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readdirSync, readFileSync } from 'node:fs';
          const directory = '.scratch/test-egress';
          const ledgers = readdirSync(directory).filter(name => /^vitest-.*\.log$/.test(name));
          if (!ledgers.length) throw new Error('Missing Firestore egress ledger');
          for (const name of ledgers) {
            if (readFileSync(`${directory}/${name}`, 'utf8').trim()) {
              throw new Error(`Firestore egress attempt recorded: ${name}`);
            }
          }
          console.log(`Firestore egress ledger: 0 attempts (${ledgers.length} ledgers)`);
          NODE
      - name: Upload emulator results and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: functions-emulator-diagnostics
          include-hidden-files: true
          path: |
            .scratch/test-manifest/**
            *-debug.log
            .scratch/test-egress/*.log
          if-no-files-found: error
          retention-days: 7

  emulator-integration:
    name: Emulator integration and Storage rules
    needs: lint
    if: needs.lint.outputs.emulator_integration == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --ignore-scripts
      - run: npm ci --prefix functions --ignore-scripts
      - run: npm run build:functions
      - name: Run isolated Firebase integration suites
        run: node scripts/runManifestTests.mjs --group integration

      - name: Upload integration results and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-results
          include-hidden-files: true
          path: |
            .scratch/test-manifest/**
            *-debug.log
            .scratch/test-egress/*.log
          if-no-files-found: ignore
          retention-days: 7

  firestore:
    name: Firestore rules
    needs: lint
    if: needs.lint.outputs.firestore == 'true'
    runs-on: ubuntu-latest
    env:
      VITE_FIREBASE_API_KEY: ci-placeholder-api-key
      VITE_FIREBASE_APP_ID: ci-placeholder-app-id
      VITE_FIREBASE_AUTH_DOMAIN: ci-placeholder.firebaseapp.com
      VITE_FIREBASE_MESSAGING_SENDER_ID: '000000000000'
      VITE_FIREBASE_PROJECT_ID: ci-placeholder-project
      VITE_FIREBASE_STORAGE_BUCKET: ci-placeholder-project.appspot.com
      VITE_FIREBASE_MEASUREMENT_ID: G-PLACEHOLDER
      VITE_FIREBASE_DATABASE_ID: '(default)'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Firestore Rules from canonical manifest
        run: node scripts/runManifestTests.mjs --group firestore

      - name: Preserve Rules manifest reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firestore-rules-results
          include-hidden-files: true
          path: |
            .scratch/test-manifest/**
            .scratch/test-egress/*.log
          if-no-files-found: error
          retention-days: 7

  build:
    name: Production build
    needs: lint
    runs-on: ubuntu-latest
    env:
      VITE_FIREBASE_API_KEY: ci-placeholder-api-key
      VITE_FIREBASE_APP_ID: ci-placeholder-app-id
      VITE_FIREBASE_AUTH_DOMAIN: ci-placeholder.firebaseapp.com
      VITE_FIREBASE_MESSAGING_SENDER_ID: '000000000000'
      VITE_FIREBASE_PROJECT_ID: ci-placeholder-project
      VITE_FIREBASE_STORAGE_BUCKET: ci-placeholder-project.appspot.com
      VITE_FIREBASE_MEASUREMENT_ID: G-PLACEHOLDER
      VITE_FIREBASE_DATABASE_ID: '(default)'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Production build
        run: node scripts/runManifestTests.mjs --group build

  quality:
    name: quality
    if: always()
    needs:
      [
        lint,
        app-tests,
        functions-tests,
        functions-emulator,
        firestore,
        build,
        emulator-integration,
        e2e,
      ]
    runs-on: ubuntu-latest
    steps:
      - name: Verify every expected CI gate (and only planned skips)
        shell: bash
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          APP_TESTS_RESULT: ${{ needs.app-tests.result }}
          FUNCTIONS_TESTS_RESULT: ${{ needs.functions-tests.result }}
          FUNCTIONS_EMULATOR_RESULT: ${{ needs.functions-emulator.result }}
          FIRESTORE_RESULT: ${{ needs.firestore.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          INTEGRATION_RESULT: ${{ needs.emulator-integration.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
          SHOULD_FUNCTIONS_TESTS: ${{ needs.lint.outputs.functions_tests }}
          SHOULD_FUNCTIONS_EMULATOR: ${{ needs.lint.outputs.functions_emulator }}
          SHOULD_FIRESTORE: ${{ needs.lint.outputs.firestore }}
          SHOULD_INTEGRATION: ${{ needs.lint.outputs.emulator_integration }}
          SHOULD_E2E: ${{ needs.lint.outputs.e2e }}
        run: |
          set -euo pipefail
          require_result() {
            local label="$1" expected="$2" actual="$3"
            if [[ "$expected" == "true" && "$actual" == "success" ]] ||
               [[ "$expected" == "false" && "$actual" == "skipped" ]]; then
              echo "$label: $actual (expected=$expected)"
            else
              echo "::error::$label: result=$actual expected_to_run=$expected"
              exit 1
            fi
          }
          test "$LINT_RESULT" = "success"
          test "$APP_TESTS_RESULT" = "success"
          test "$BUILD_RESULT" = "success"
          require_result functions-unit "$SHOULD_FUNCTIONS_TESTS" "$FUNCTIONS_TESTS_RESULT"
          require_result functions-emulator "$SHOULD_FUNCTIONS_EMULATOR" "$FUNCTIONS_EMULATOR_RESULT"
          require_result firestore "$SHOULD_FIRESTORE" "$FIRESTORE_RESULT"
          require_result integration "$SHOULD_INTEGRATION" "$INTEGRATION_RESULT"
          require_result playwright "$SHOULD_E2E" "$E2E_RESULT"

  e2e:
    name: Playwright E2E
    needs: lint
    if: needs.lint.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install root dependencies
        run: npm ci --ignore-scripts

      - name: Install Functions dependencies
        run: npm ci --prefix functions --ignore-scripts

      - name: Install Playwright Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run canonical E2E suite (PR smoke or release full)
        env:
          CARVE_E2E_PROFILE: ${{ github.event_name == 'workflow_dispatch' && inputs.full_validation && 'full' || 'pr' }}
        run: exec node scripts/runManifestTests.mjs --group e2e --profile "$CARVE_E2E_PROFILE"

      - name: Upload Playwright results and failure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-failure-artifacts
          include-hidden-files: true
          path: |
            test-results/
            .scratch/test-manifest/**
            .scratch/test-egress/*.log
            *-debug.log
          if-no-files-found: ignore
          retention-days: 7

  release-validation:
    name: Full release additions
    if: github.event_name == 'workflow_dispatch' && inputs.full_validation
    needs: quality
    runs-on: ubuntu-latest
    env:
      VITE_FIREBASE_API_KEY: ci-placeholder-api-key
      VITE_FIREBASE_APP_ID: ci-placeholder-app-id
      VITE_FIREBASE_AUTH_DOMAIN: ci-placeholder.firebaseapp.com
      VITE_FIREBASE_MESSAGING_SENDER_ID: '000000000000'
      VITE_FIREBASE_PROJECT_ID: ci-placeholder-project
      VITE_FIREBASE_STORAGE_BUCKET: ci-placeholder-project.appspot.com
      VITE_FIREBASE_MEASUREMENT_ID: G-PLACEHOLDER
      VITE_FIREBASE_DATABASE_ID: '(default)'
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --ignore-scripts
      - run: npm ci --prefix functions --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - name: Release additions from canonical manifest (shared builds once)
        run: node scripts/runLocalTestSuite.mjs release
      - name: Release diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-validation-results
          include-hidden-files: true
          path: |
            .scratch/test-manifest/**
            .scratch/test-egress/*.log
            test-results/
            *-debug.log
          if-no-files-found: error
          retention-days: 14
